name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Receipts have their fields, sections and pinned sources
        run: python3 receipts.py lint
      - name: README tables match the receipts
        run: python3 receipts.py ledger --check
      - name: Tests
        run: python3 -m unittest discover -v
      - name: Offline example
        run: python3 compare.py examples/library-search.json
